services:
  postgres:
    image: postgres:16
    container_name: issuas-postgres
    environment:
      POSTGRES_USER: issuas
      POSTGRES_PASSWORD: 3CDGKPFE32
      POSTGRES_DB: issuas
    ports:
      - "5432:5432"
    volumes:
      - issuas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issuas -d issuas"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: src/IsSuas.Api/Dockerfile
    container_name: issuas-api
    env_file:
      - .env
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      # vzhľad (HTML/CSS/JS) sa berie priamo z disku — zmeny stačí obnoviť v prehliadači
      - ../backend/src/IsSuas.Api/wwwroot:/app/wwwroot:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  issuas_pgdata:
