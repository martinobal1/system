<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IS SUAS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="/css/dronemap.css" />
  <style>
    :root {
      --bg: #edf2f6;
      --bg-accent: #e3edf5;
      --panel: #ffffff;
      --ink: #142433;
      --muted: #5a6d7e;
      --primary: #0f4c6e;
      --primary-soft: #1a6f9a;
      --accent: #0d8f7a;
      --accent-soft: #e6f7f3;
      --sky: #2b7bb9;
      --sky-soft: #e8f3fb;
      --line: #d3dde6;
      --danger: #b42318;
      --warn: #b86e00;
      --ok: #0d6b3c;
      --shadow: 0 1px 2px rgba(20, 36, 51, 0.04), 0 8px 24px rgba(20, 36, 51, 0.06);
      --radius: 12px;
      --sidebar: #0f2435;
      --sidebar-ink: #dce8f2;
      --font: "Source Sans 3", "Segoe UI", sans-serif;
      --font-display: "IBM Plex Sans", "Source Sans 3", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(1200px 500px at 90% -10%, #d7eaf6 0%, transparent 55%),
        radial-gradient(900px 420px at -5% 20%, #d9f0ea 0%, transparent 50%),
        var(--bg);
    }
    .login-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        linear-gradient(155deg, #cfe0ec 0%, #e8f1f7 42%, #f2f7fa 100%);
    }
    .login-card {
      width: min(420px, 92vw);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 2rem;
      display: grid;
      gap: 0.85rem;
    }
    .brand {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--primary);
    }
    .login-card h1 { margin: 0; font-size: 1.25rem; font-family: var(--font-display); }
    .muted, .hint { color: var(--muted); margin: 0; }
    label { display: grid; gap: 0.35rem; }
    input, button, select, textarea { font: inherit; }
    input, select, textarea {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.7rem 0.8rem;
      background: #fff;
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid rgba(26, 111, 154, 0.25);
      border-color: var(--primary-soft);
    }
    button {
      border: 0;
      border-radius: 8px;
      background: linear-gradient(180deg, var(--primary-soft), var(--primary));
      color: #fff;
      padding: 0.75rem 1rem;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
    }
    button:hover { filter: brightness(1.05); box-shadow: 0 4px 12px rgba(15, 76, 110, 0.22); }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: 0.6; cursor: wait; filter: none; box-shadow: none; }
    .error {
      color: var(--danger);
      margin: 0;
      padding: 0.6rem 0.75rem;
      background: #fdecea;
      border: 1px solid #f5c2c0;
      border-radius: 8px;
    }
    .app { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
    .sidebar {
      background:
        linear-gradient(180deg, #14324a 0%, var(--sidebar) 48%, #0b1c2a 100%);
      color: var(--sidebar-ink);
      padding: 1.25rem 0.75rem;
      box-shadow: inset -1px 0 0 rgba(255,255,255,0.04);
    }
    .sidebar-brand {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.3rem;
      letter-spacing: -0.02em;
      padding: 0.5rem 0.75rem 1.35rem;
    }
    .sidebar-brand span {
      display: block;
      margin-top: 0.2rem;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #8fb0c8;
    }
    .sidebar nav { display: grid; gap: 0.2rem; }
    .nav {
      background: transparent;
      color: #d7e3ee;
      text-align: left;
      font-weight: 500;
      border-radius: 8px;
      box-shadow: none;
    }
    .nav:hover { background: rgba(255,255,255,0.08); filter: none; box-shadow: none; }
    .nav.active {
      background: linear-gradient(90deg, rgba(13, 143, 122, 0.35), rgba(43, 123, 185, 0.22));
      color: #fff;
      box-shadow: inset 3px 0 0 var(--accent);
      filter: none;
    }
    main { display: grid; grid-template-rows: auto 1fr; min-width: 0; }
    .topbar {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.9rem 1.35rem;
    }
    .userbox { display: flex; gap: 0.75rem; align-items: center; }
    #logout-btn {
      background: transparent;
      color: var(--primary);
      border: 1px solid var(--line);
      box-shadow: none;
    }
    #logout-btn:hover { background: var(--sky-soft); filter: none; }
    .content { padding: 1.35rem 1.5rem 2rem; }
    .panel, table {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .panel { padding: 1.1rem 1.15rem; }
    .stack { display: grid; gap: 1.1rem; }
    h2 {
      margin: 0.35rem 0 0.65rem;
      font-family: var(--font-display);
      font-size: 1.15rem;
      letter-spacing: -0.01em;
    }
    table { width: 100%; border-collapse: separate; border-spacing: 0; overflow: hidden; }
    th, td {
      text-align: left;
      padding: 0.75rem 0.9rem;
      border-bottom: 1px solid var(--line);
    }
    th {
      background: linear-gradient(180deg, #f7fafc, #f1f5f8);
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted);
    }
    tr:last-child td { border-bottom: 0; }
    .msg {
      padding: 0.85rem 1rem;
      border: 1px solid #c7dfef;
      background: linear-gradient(120deg, #eaf5fb, #f3faf8);
      border-radius: var(--radius);
    }
    .hidden { display: none !important; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 0.25rem; }
    .form-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1rem;
      display: grid;
      gap: 0.75rem;
    }
    .form-panel h3 { margin: 0; font-size: 1.05rem; color: var(--primary); font-family: var(--font-display); }
    .form-grid {
      display: grid;
      gap: 0.75rem;
      grid-template-columns: 1fr 1fr;
    }
    .form-grid .full { grid-column: 1 / -1; }
    .form-grid label { font-size: 0.9rem; }
    textarea { min-height: 90px; resize: vertical; width: 100%; }
    select { width: 100%; }
    button.secondary {
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--line);
      box-shadow: none;
    }
    button.secondary:hover { background: var(--sky-soft); filter: none; }
    button.secondary:disabled {
      opacity: 1;
      background: var(--accent-soft);
      border-color: #b7e4da;
      color: var(--accent);
    }
    .row-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      align-items: center;
    }
    .row-actions button {
      padding: 0.35rem 0.7rem;
      font-size: 0.8rem;
      border-radius: 8px;
    }
    .org-name {
      display: inline-block;
    }
    .org-name::before {
      content: "";
      display: inline-block;
      width: calc(var(--org-level, 0) * 1.1rem);
    }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 0.85rem;
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1rem 1.05rem;
      position: relative;
      overflow: hidden;
    }
    .stat::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, var(--sky), var(--accent));
    }
    .stat .n {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--primary);
      line-height: 1.1;
    }
    .stat .l { color: var(--muted); font-size: 0.86rem; margin-top: 0.25rem; }
    .stat .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem 0.7rem;
      margin-top: 0.55rem;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .dot {
      width: 0.55rem; height: 0.55rem;
      border-radius: 50%;
      display: inline-block;
      margin-right: 0.28rem;
      vertical-align: middle;
    }
    .dot-ok { background: var(--ok); }
    .dot-warn { background: #e09b2d; }
    .dot-danger { background: var(--danger); }
    .dash-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 1rem;
      align-items: stretch;
    }
    .dash-grid > * {
      min-width: 0;
      height: 100%;
    }
    .dash-grid .chart-panel,
    .dash-grid .weather-panel,
    .dash-grid .dash-stats,
    .dash-grid .dash-table-panel {
      height: 100%;
      box-sizing: border-box;
    }
    .dash-stats {
      grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
      grid-template-rows: repeat(4, minmax(0, 1fr));
      align-content: stretch !important;
    }
    .dash-stats .stat {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
      padding: 0.75rem 0.9rem;
    }
    .dash-table-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1rem 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      min-height: 0;
    }
    .dash-table-panel h2 {
      margin: 0;
      flex-shrink: 0;
    }
    .dash-table-panel table {
      margin: 0;
      flex: 1;
    }
    .dash-map-panel {
      position: relative;
      background:
        linear-gradient(160deg, #0f2435 0%, #14344a 42%, #0f4c6e 100%);
      border: 1px solid #1a3a52;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      min-height: 280px;
    }
    .dash-map-panel .dash-map-chrome {
      position: absolute;
      z-index: 500;
      left: 0; right: 0; top: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      background: linear-gradient(180deg, rgba(15,36,53,0.88) 0%, rgba(15,36,53,0.35) 70%, transparent 100%);
      pointer-events: none;
    }
    .dash-map-panel .dash-map-chrome > * { pointer-events: auto; }
    .dash-map-panel .dash-map-chrome h2 {
      margin: 0;
      color: #fff;
      font-size: 1.05rem;
      text-shadow: 0 1px 2px rgba(0,0,0,0.35);
    }
    .dash-map-panel .dash-map-chrome p {
      margin: 0.2rem 0 0;
      color: #b8c9d8;
      font-size: 0.82rem;
    }
    .dash-map-panel .dash-map-chrome button {
      padding: 0.4rem 0.75rem;
      font-size: 0.8rem;
      background: rgba(255,255,255,0.12);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      box-shadow: none;
    }
    .dash-map-panel .dash-map-chrome button:hover {
      background: rgba(13,143,122,0.85);
      border-color: transparent;
      filter: none;
    }
    #dash-drone-map {
      height: 320px;
      width: 100%;
      background: #1a3044;
    }
    #dash-drone-map .leaflet-control-attribution {
      background: rgba(255,255,255,0.75);
      font-size: 0.65rem;
    }
    .weather-panel {
      background:
        linear-gradient(145deg, #f7fbfe 0%, #eef7f4 55%, #ffffff 100%);
      border: 1px solid #c9dde9;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 0.85rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      box-sizing: border-box;
    }
    .weather-head {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      align-items: flex-start;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .weather-head h2 { margin: 0; font-size: 1.05rem; }
    .weather-source {
      font-size: 0.72rem;
      color: var(--muted);
      text-align: right;
      line-height: 1.35;
    }
    .weather-now {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.85rem;
      align-items: center;
      flex-shrink: 0;
    }
    .weather-temp {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      color: var(--primary);
      line-height: 1;
    }
    .weather-temp small {
      display: block;
      margin-top: 0.25rem;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0;
    }
    .weather-kpis {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.25rem 0.75rem;
      font-size: 0.82rem;
    }
    .weather-kpis strong { color: var(--ink); font-weight: 600; }
    .weather-advice {
      padding: 0.45rem 0.65rem;
      border-radius: 8px;
      background: var(--accent-soft);
      border: 1px solid #b7e4da;
      color: #0a5c4e;
      font-size: 0.8rem;
      line-height: 1.35;
      flex-shrink: 0;
    }
    .weather-chart-wrap {
      background: rgba(255,255,255,0.85);
      border: 1px solid #d5e4ee;
      border-radius: 10px;
      padding: 0.45rem 0.35rem 0.3rem;
      flex: 1 1 auto;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: stretch;
    }
    .weather-chart-wrap svg.wx-chart {
      width: 100%;
      height: 100%;
      min-height: 148px;
      max-height: none;
      display: block;
      flex: 1 1 auto;
    }
    .weather-chart-wrap .wx-hit { cursor: crosshair; }
    .weather-chart-wrap .wx-focus { pointer-events: none; }
    .weather-legend {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      font-size: 0.75rem;
      color: var(--muted);
      padding: 0.2rem 0.35rem 0.1rem;
      flex-shrink: 0;
    }
    .weather-legend i {
      display: inline-block;
      width: 14px;
      height: 3px;
      border-radius: 2px;
      margin-right: 0.35rem;
      vertical-align: middle;
    }
    .leg-temp { background: var(--sky); }
    .leg-wind { background: var(--accent); }
    .chart-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.1rem 1.2rem;
      display: grid;
      gap: 0.75rem;
    }
    .chart-panel h2 { margin: 0; }
    .pie-layout {
      display: grid;
      grid-template-columns: minmax(160px, 200px) 1fr;
      gap: 1rem;
      align-items: center;
    }
    .pie-layout svg { width: 100%; max-width: 200px; height: auto; display: block; margin: 0 auto; }
    .pie-legend { display: grid; gap: 0.35rem; font-size: 0.84rem; }
    .pie-legend-row {
      display: grid;
      grid-template-columns: 12px 1fr auto;
      gap: 0.45rem;
      align-items: center;
      color: var(--muted);
      padding: 0.2rem 0.3rem;
      border-radius: 6px;
      cursor: default;
      transition: background 0.15s ease;
    }
    .pie-legend-row:hover,
    .pie-legend-row.is-hot {
      background: var(--sky-soft);
      color: var(--ink);
    }
    .pie-legend-row b { color: var(--ink); font-weight: 600; }
    .pie-swatch { width: 12px; height: 12px; border-radius: 3px; }
    .pie-slice {
      cursor: pointer;
      transition: opacity 0.15s ease, filter 0.15s ease;
      outline: none;
    }
    .pie-slice:hover,
    .pie-slice.is-hot {
      filter: brightness(1.12) saturate(1.08);
      opacity: 1;
    }
    .pie-layout.is-hovering .pie-slice:not(.is-hot) { opacity: 0.45; }
    .pie-center-label {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 700;
      fill: var(--primary);
      pointer-events: none;
    }
    .pie-center-sub { font-size: 0.7rem; fill: var(--muted); pointer-events: none; }
    .chart-tip {
      position: fixed;
      z-index: 4000;
      pointer-events: none;
      max-width: 260px;
      padding: 0.55rem 0.75rem;
      border-radius: 10px;
      background: #142433;
      color: #f2f7fa;
      font-size: 0.82rem;
      line-height: 1.35;
      box-shadow: 0 8px 24px rgba(20, 36, 51, 0.28);
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.12s ease, transform 0.12s ease;
    }
    .chart-tip.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .chart-tip .tip-swatch {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      margin-right: 0.35rem;
      vertical-align: middle;
    }
    .chart-tip strong { display: block; margin-bottom: 0.15rem; font-size: 0.88rem; }
    .dash-charts-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1rem;
    }
    .bar-chart {
      display: grid;
      gap: 0.65rem;
      margin-top: 0.35rem;
    }
    .bar-row {
      display: grid;
      grid-template-columns: 110px 1fr auto;
      gap: 0.55rem;
      align-items: center;
      font-size: 0.84rem;
      color: var(--muted);
    }
    .bar-track {
      height: 12px;
      background: #e8eef3;
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 999px;
      min-width: 2px;
      transition: width 0.35s ease;
    }
    .bar-row b { color: var(--ink); font-variant-numeric: tabular-nums; }
    @media (max-width: 1100px) {
      .dash-charts-3 { grid-template-columns: 1fr; }
    }
    @media (max-width: 700px) {
      .pie-layout { grid-template-columns: 1fr; }
      .bar-row { grid-template-columns: 1fr; gap: 0.25rem; }
    }
    .badge {
      display: inline-block;
      padding: 0.18rem 0.55rem;
      font-size: 0.78rem;
      font-weight: 600;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #f0f4f8;
      color: var(--ink);
      white-space: nowrap;
    }
    .badge-ok, .badge-inservice, .badge-active, .badge-approved, .badge-closed, .badge-resolved, .badge-sent { background: #e8f6ef; border-color: #b7e0c8; color: #0d6b3c; }
    .badge-warn, .badge-draft, .badge-open, .badge-reported, .badge-pending, .badge-submitted { background: #fff7e6; border-color: #f0d9a8; color: #8a5a00; }
    .badge-danger, .badge-suspended, .badge-critical, .badge-rejected, .badge-cancelled, .badge-overdue { background: #fdecea; border-color: #f5c2c0; color: var(--danger); }

    /* —— farebný systém stránok (ako Prehľad) —— */
    .page-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 0.85rem 1.25rem;
      padding: 1rem 1.15rem;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }
    .page-head::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: linear-gradient(180deg, var(--sky), var(--accent));
    }
    .page-head h2 { margin: 0; }
    .page-head p { margin: 0.3rem 0 0; max-width: 42rem; }
    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      align-items: center;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #f5f8fb;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
    }
    .chip b { font-variant-numeric: tabular-nums; color: var(--primary); }
    .chip-soft {
      background: var(--sky-soft);
      border-color: #c5dcee;
      color: var(--primary);
    }
    .chip-ok { background: #e8f6ef; border-color: #b7e0c8; color: var(--ok); }
    .chip-warn { background: #fff7e6; border-color: #f0d9a8; color: var(--warn); }
    .chip-danger { background: #fdecea; border-color: #f5c2c0; color: var(--danger); }
    .swatch {
      display: inline-block;
      width: 0.7rem;
      height: 0.7rem;
      border-radius: 4px;
      flex-shrink: 0;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08);
      vertical-align: -0.05rem;
    }
    .swatch-lg {
      width: 0.85rem;
      height: 0.85rem;
      border-radius: 5px;
    }
    .entity-label {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      min-width: 0;
    }
    .entity-label .code {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--muted);
    }
    .level-pill {
      display: inline-block;
      margin-left: 0.35rem;
      padding: 0.1rem 0.45rem;
      font-size: 0.7rem;
      font-weight: 700;
      border-radius: 999px;
      background: #eef3f7;
      color: var(--muted);
      vertical-align: middle;
    }
    .table-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .table-card > table,
    .chart-panel > table,
    .dash-table-panel > table,
    .chart-panel .table-card,
    .dash-table-panel .table-card,
    .weather-panel .table-card,
    .form-panel .table-card {
      box-shadow: none;
      border: 0;
      border-radius: 0;
    }
    .chart-panel .table-card,
    .dash-table-panel .table-card,
    .weather-panel .table-card {
      background: transparent;
    }
    table tbody tr {
      transition: background 0.12s ease;
    }
    table tbody tr:hover td {
      background: rgba(43, 123, 185, 0.05);
    }
    table tbody tr.row-tint td:first-child {
      box-shadow: inset 3px 0 0 var(--row-accent, var(--sky));
    }
    .color-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      padding: 0.85rem 1rem;
      background: linear-gradient(120deg, #f7fafc, #f3faf8);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .color-legend .chip {
      background: #fff;
      cursor: default;
    }
    .form-panel {
      position: relative;
      overflow: hidden;
    }
    .form-panel::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, var(--primary-soft), var(--accent));
    }
    .section-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1rem 1.1rem;
      display: grid;
      gap: 0.75rem;
    }
    .section-card > h2 {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .org-tree-name {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding-left: calc(var(--org-level, 0) * 1.15rem);
    }
    .org-tree-name .swatch {
      box-shadow: 0 0 0 2px rgba(43, 123, 185, 0.2), inset 0 0 0 1px rgba(0,0,0,0.06);
      background: var(--swatch-color, var(--sky));
    }
    .section-card > h2::before {
      content: "";
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 3px;
      background: var(--section-accent, var(--sky));
      box-shadow: 0 0 0 3px rgba(43, 123, 185, 0.18);
    }
    .history-panel {
      background: #f7fafc;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.75rem;
      font-size: 0.9rem;
      max-height: 240px;
      overflow: auto;
    }
    .history-panel h4 { margin: 0 0 0.5rem; font-size: 0.95rem; color: var(--primary); }

    /* —— Mobil / tablet: hamburger (PC bez zmeny) —— */
    .menu-toggle {
      display: none;
      align-items: center;
      justify-content: center;
      width: 2.5rem;
      height: 2.5rem;
      padding: 0;
      flex-shrink: 0;
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: none;
    }
    .menu-toggle:hover { background: var(--sky-soft); filter: none; box-shadow: none; }
    .menu-toggle .burger {
      display: block;
      width: 1.15rem;
      height: 2px;
      background: currentColor;
      border-radius: 2px;
      position: relative;
    }
    .menu-toggle .burger::before,
    .menu-toggle .burger::after {
      content: "";
      position: absolute;
      left: 0;
      width: 100%;
      height: 2px;
      background: currentColor;
      border-radius: 2px;
    }
    .menu-toggle .burger::before { top: -6px; }
    .menu-toggle .burger::after { top: 6px; }
    .nav-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 36, 51, 0.45);
      z-index: 90;
      border: 0;
      padding: 0;
      margin: 0;
      cursor: pointer;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
    }
    #page-title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.05rem;
      color: var(--primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

    @media (max-width: 1100px) {
      .dash-charts-3 { grid-template-columns: 1fr; }
    }
    @media (max-width: 980px) {
      .dash-grid { grid-template-columns: 1fr; }
      .dash-stats { grid-template-rows: none; }
    }
    @media (max-width: 900px) {
      .menu-toggle { display: inline-flex; }
      .app {
        grid-template-columns: 1fr;
        min-height: 100dvh;
      }
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: min(300px, 86vw);
        z-index: 100;
        padding: 1rem 0.75rem 1.5rem;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        transform: translateX(-105%);
        transition: transform 0.22s ease;
        box-shadow: 8px 0 28px rgba(15, 36, 51, 0.28);
      }
      .app.nav-open .sidebar { transform: translateX(0); }
      .app.nav-open .nav-backdrop { display: block; }
      .sidebar-brand { padding-bottom: 1rem; }
      .sidebar nav { display: grid; gap: 0.15rem; grid-template-columns: 1fr; }
      .nav { padding: 0.7rem 0.85rem; font-size: 0.95rem; }
      .topbar {
        padding: 0.65rem 0.85rem;
        gap: 0.5rem;
        position: sticky;
        top: 0;
        z-index: 50;
      }
      .userbox {
        gap: 0.4rem;
        flex-shrink: 1;
        min-width: 0;
      }
      #global-search-form {
        display: none;
      }
      #display-name {
        display: none;
      }
      #logout-btn {
        padding: 0.45rem 0.7rem;
        font-size: 0.82rem;
      }
      .content { padding: 0.85rem 0.85rem 1.5rem; }
      .form-grid { grid-template-columns: 1fr; }
      .page-head {
        flex-direction: column;
        align-items: flex-start;
        padding: 0.85rem 0.95rem;
      }
      .page-head p { font-size: 0.88rem; }
      .stat-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.65rem;
      }
      .stat { padding: 0.75rem 0.8rem; }
      .stat .n { font-size: 1.35rem; }
      .table-card,
      .dash-table-panel,
      .chart-panel,
      .section-card {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      table { min-width: 560px; font-size: 0.88rem; }
      th, td { padding: 0.6rem 0.7rem; }
      .toolbar { gap: 0.4rem; }
      .toolbar button { font-size: 0.85rem; padding: 0.6rem 0.8rem; }
      .login-card { width: min(420px, 94vw); padding: 1.35rem 1.15rem; }
      .login-card .hint { font-size: 0.8rem; }
      .pie-layout { grid-template-columns: 1fr; }
      .bar-row { grid-template-columns: 1fr; gap: 0.25rem; }
      .dash-map-panel { min-height: 220px; }
      .weather-now { flex-wrap: wrap; }
      .weather-temp { font-size: 2rem; }
      .chip { font-size: 0.75rem; }
      .color-legend { gap: 0.35rem; padding: 0.7rem 0.75rem; }
    }
    @media (max-width: 420px) {
      .stat-grid { grid-template-columns: 1fr; }
      #page-title { font-size: 0.95rem; max-width: 42vw; }
    }
  </style>
</head>
<body>
  <div id="login-view" class="login-shell">
    <form id="login-form" class="login-card">
      <p class="brand">IS SUAS</p>
      <h1>Prihlasenie</h1>
      <p class="muted">Informacny system statnych bezpilotnych leteckych systemov</p>
      <label>Pouzivatelske meno
        <input id="username" value="gestor" autocomplete="username" required />
      </label>
      <label>Heslo
        <input id="password" type="password" value="Heslo123!" autocomplete="current-password" required />
      </label>
      <p id="login-error" class="error hidden"></p>
      <button id="login-btn" type="submit">Prihlasit sa</button>
      <button id="sso-btn" type="button" class="secondary">Jednotné prihlásenie (vývoj)</button>
      <p class="hint">Demo: gestor / Heslo123!</p>
      <p class="hint">Jednotné prihlásenie (vývoj): spätné volanie code=dev-sso:gestor</p>
      <p class="hint">Ak sa nic nedeje, API nebezi. V terminali musi byt: Pocuva na http://localhost:5211</p>
    </form>
  </div>

  <div id="app-view" class="app hidden">
    <button type="button" class="nav-backdrop" id="nav-backdrop" aria-label="Zavrieť menu"></button>
    <aside class="sidebar" id="app-sidebar">
      <div class="sidebar-brand">IS SUAS<span>Evidencia UAS · ATLAS</span></div>
      <nav>
        <button type="button" data-page="dashboard" class="nav active">Prehlad</button>
        <button type="button" data-page="orgs" class="nav">Organizacna struktura</button>
        <button type="button" data-page="accounts" class="nav">Prevadzkovatelia</button>
        <button type="button" data-page="delegations" class="nav">Delegacie</button>
        <button type="button" data-page="pilots" class="nav">Piloti</button>
        <button type="button" data-page="operations" class="nav">Operacie</button>
        <button type="button" data-page="flights" class="nav">Dennik letov</button>
        <button type="button" data-page="defects" class="nav">Poruchy</button>
        <button type="button" data-page="incidents" class="nav">Incidenty</button>
        <button type="button" data-page="documents" class="nav">Dokumenty</button>
        <button type="button" data-page="reports" class="nav">Reporty</button>
        <button type="button" data-page="calendar" class="nav">Kalendar</button>
        <button type="button" data-page="map" class="nav">Mapa</button>
        <button type="button" data-page="admin" class="nav">Administracia</button>
        <button type="button" data-page="uas" class="nav">Register UAS</button>
        <button type="button" data-page="components" class="nav">Komponenty</button>
        <button type="button" data-page="batteries" class="nav">Baterie</button>
      </nav>
    </aside>
    <main>
      <header class="topbar">
        <div class="topbar-left">
          <button type="button" class="menu-toggle" id="menu-toggle" aria-label="Otvoriť menu" aria-expanded="false" aria-controls="app-sidebar">
            <span class="burger" aria-hidden="true"></span>
          </button>
          <div id="page-title">Prehlad</div>
        </div>
        <div class="userbox">
          <form id="global-search-form" class="toolbar" style="margin:0;gap:0.35rem">
            <input id="global-search-q" type="search" placeholder="Hladat..." style="min-width:160px;padding:0.45rem 0.6rem" />
            <button type="submit" class="secondary" id="global-search-btn" style="padding:0.45rem 0.75rem">Hladat</button>
          </form>
          <span id="display-name"></span>
          <button id="logout-btn" type="button">Odhlasit</button>
        </div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>

  <script>
    const state = {
      token: localStorage.getItem('issuas.token'),
      displayName: localStorage.getItem('issuas.name') || '',
      /** @type {{ lat:number, lon:number, radiusM:number, label:string }|null} */
      pendingFlightLocation: null,
      openFlightForm: false,
      mapStartPick: false
    };

    const loginView = document.getElementById('login-view');
    const appView = document.getElementById('app-view');
    const content = document.getElementById('content');
    const pageTitle = document.getElementById('page-title');
    const displayNameEl = document.getElementById('display-name');
    const loginError = document.getElementById('login-error');
    const loginBtn = document.getElementById('login-btn');

    function showError(msg) {
      loginError.textContent = msg;
      loginError.classList.remove('hidden');
    }

    async function api(path, options = {}) {
      const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
      if (state.token) headers.Authorization = 'Bearer ' + state.token;

      let res;
      try {
        res = await fetch(path, { ...options, headers });
      } catch (e) {
        throw new Error('Nepodarilo sa spojit s API. Spustite: dotnet run --project src/IsSuas.Api a nechajte terminal otvoreny.');
      }

      if (res.status === 401) {
        if (!path.includes('/auth/login')) logout(false);
        let detail = 'Neplatne prihlasovacie udaje';
        try {
          const body = await res.json();
          detail = body.detail || body.title || detail;
        } catch {}
        throw new Error(detail);
      }

      if (!res.ok) {
        let detail = 'Chyba ' + res.status;
        try {
          const body = await res.json();
          detail = body.detail || body.title || detail;
        } catch {}
        throw new Error(detail);
      }

      if (res.status === 204) return null;
      return res.json();
    }

    function showApp() {
      loginView.classList.add('hidden');
      appView.classList.remove('hidden');
      displayNameEl.textContent = state.displayName;
      navigate('dashboard');
    }

    function showLogin() {
      closeNav();
      appView.classList.add('hidden');
      loginView.classList.remove('hidden');
    }

    function logout(clearStorage = true) {
      state.token = null;
      state.displayName = '';
      if (clearStorage) {
        localStorage.removeItem('issuas.token');
        localStorage.removeItem('issuas.name');
      }
      showLogin();
    }

    document.getElementById('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      loginError.classList.add('hidden');
      loginBtn.disabled = true;
      loginBtn.textContent = 'Prihlasujem...';
      try {
        const body = {
          userName: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value
        };
        const res = await api('/api/v1/auth/login', {
          method: 'POST',
          body: JSON.stringify(body)
        });
        state.token = res.accessToken;
        state.displayName = res.displayName;
        localStorage.setItem('issuas.token', state.token);
        localStorage.setItem('issuas.name', state.displayName);
        showApp();
      } catch (err) {
        showError(err.message || 'Prihlasenie zlyhalo');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Prihlasit sa';
      }
    });

    document.getElementById('sso-btn').addEventListener('click', async function () {
      loginError.classList.add('hidden');
      try {
        const sso = await api('/api/v1/auth/sso/start?returnUrl=/');
        if (sso.redirectUrl) {
          window.location.href = sso.redirectUrl;
          return;
        }
        showError(sso.message || 'Jednotné prihlásenie nie je dostupné');
      } catch (err) {
        showError(err.message || 'Jednotné prihlásenie zlyhalo');
      }
    });

    async function completeSsoCallbackFromUrl() {
      var path = window.location.pathname || '';
      if (path.indexOf('/auth/callback') < 0) return false;
      var params = new URLSearchParams(window.location.search);
      var code = params.get('code');
      if (!code) {
        showError('Spätné volanie prihlásenia: chýba kód');
        return true;
      }
      try {
        var q = '/api/v1/auth/sso/callback?code=' + encodeURIComponent(code);
        var stateParam = params.get('state');
        if (stateParam) q += '&state=' + encodeURIComponent(stateParam);
        var res = await api(q);
        state.token = res.accessToken;
        state.displayName = res.displayName;
        localStorage.setItem('issuas.token', state.token);
        localStorage.setItem('issuas.name', state.displayName);
        window.history.replaceState({}, '', '/');
        showApp();
      } catch (err) {
        showError(err.message || 'Spätné volanie prihlásenia zlyhalo');
      }
      return true;
    }

    document.getElementById('logout-btn').addEventListener('click', function () {
      logout(true);
    });

    function setNavOpen(open) {
      appView.classList.toggle('nav-open', !!open);
      var toggle = document.getElementById('menu-toggle');
      if (toggle) {
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        toggle.setAttribute('aria-label', open ? 'Zavrieť menu' : 'Otvoriť menu');
      }
      document.body.style.overflow = open ? 'hidden' : '';
    }

    function closeNav() { setNavOpen(false); }

    document.getElementById('menu-toggle').addEventListener('click', function () {
      setNavOpen(!appView.classList.contains('nav-open'));
    });
    document.getElementById('nav-backdrop').addEventListener('click', closeNav);
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') closeNav();
    });
    window.addEventListener('resize', function () {
      if (window.innerWidth > 900) closeNav();
    });

    document.querySelectorAll('.nav').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.nav').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        closeNav();
        navigate(btn.dataset.page);
      });
    });

    const titles = {
      dashboard: 'Prehlad',
      orgs: 'Organizacna struktura',
      accounts: 'Prevadzkovatelia',
      delegations: 'Delegacie opravneni',
      pilots: 'Piloti',
      operations: 'Operacie',
      flights: 'Dennik letov',
      defects: 'Poruchy',
      incidents: 'Incidenty',
      documents: 'Dokumenty',
      reports: 'Reporty',
      calendar: 'Kalendar',
      map: 'Mapa — VFR / vzdušné priestory',
      admin: 'Administracia',
      uas: 'Register UAS',
      components: 'Komponenty',
      batteries: 'Baterie',
      search: 'Vysledky hladania'
    };

    document.getElementById('global-search-form').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var q = document.getElementById('global-search-q').value.trim();
      state.searchQuery = q;
      document.querySelectorAll('.nav').forEach(function (b) { b.classList.remove('active'); });
      navigate('search');
    });

    async function navigate(page) {
      pageTitle.textContent = titles[page] || page;
      if (window.IsSuasDroneMap) window.IsSuasDroneMap.destroyMap();
      content.classList.toggle('content-map', page === 'map');
      content.innerHTML = '<div class="panel">Nacitavam...</div>';
      try {
        if (page === 'search') {
          const q = (state.searchQuery || '').trim();
          document.getElementById('global-search-q').value = q;
          if (q.length < 2) {
            content.innerHTML = '<div class="stack"><div class="msg">Zadajte aspon 2 znaky do hladania v hornom paneli.</div></div>';
            return;
          }
          const res = await api('/api/v1/search?q=' + encodeURIComponent(q) + '&limit=8');
          const hits = res.hits || [];
          if (!hits.length) {
            content.innerHTML = '<div class="stack"><div class="msg">Ziadne vysledky pre „' + q.replace(/</g, '') + '“.</div></div>';
            return;
          }
          const typeLabels = {
            Uas: 'UAS',
            Pilot: 'Piloti',
            Operation: 'Operacie',
            Account: 'Ucty',
            SafetyEvent: 'Incidenty',
            ControlAudit: 'Audit'
          };
          const groups = {};
          hits.forEach(function (h) {
            if (!groups[h.entityType]) groups[h.entityType] = [];
            groups[h.entityType].push(h);
          });
          var html = '<div class="stack"><div class="msg">Hladanie: <b>' + q.replace(/</g, '') +
            '</b> — ' + hits.length + ' vysledkov</div>';
          Object.keys(groups).forEach(function (type) {
            html += '<h2>' + (typeLabels[type] || type) + '</h2>';
            html += groups[type].map(function (h) {
              return '<button type="button" class="search-hit secondary" data-type="' + h.entityType +
                '" data-id="' + h.id + '" style="display:block;width:100%;text-align:left;margin-bottom:0.4rem">' +
                '<strong>' + h.title + '</strong> ' + statusBadge(h.status || '') +
                '<div class="muted">' + (h.subtitle || '') +
                (h.orgUnitName ? ' · ' + h.orgUnitName : '') + '</div></button>';
            }).join('');
          });
          html += '</div>';
          content.innerHTML = html;
          content.querySelectorAll('.search-hit').forEach(function (btn) {
            btn.onclick = function () {
              openSearchHit(btn.dataset.type, btn.dataset.id, btn.querySelector('strong').textContent);
            };
          });
          return;
        }
        if (page === 'dashboard') {
          const orgs = await api('/api/v1/org-units');
          const scope = state.dashboardScope || 'central';
          let selectedOrg = (typeof state.dashboardOrgUnitId === 'string') ? state.dashboardOrgUnitId : '';
          const branchOrgs = orgs.filter(function (o) { return o.level === 1; });
          const unitOrgs = orgs.filter(function (o) { return o.level >= 2; });
          if (scope === 'branch' && !selectedOrg && branchOrgs.length)
            selectedOrg = branchOrgs[0].id;
          if (scope === 'unit' && !selectedOrg && unitOrgs.length)
            selectedOrg = unitOrgs[0].id;

          var dashUrl = '/api/v1/dashboard?scope=' + encodeURIComponent(scope);
          if (scope !== 'central' && selectedOrg)
            dashUrl += '&orgUnitId=' + encodeURIComponent(selectedOrg);

          const d = await api(dashUrl);
          state.dashboardOrgUnitId = selectedOrg;

          let weather = null;
          try {
            weather = await api('/api/v1/weather');
          } catch (_) { /* weather optional for overview */ }

          const scopeLabel = scope === 'branch' ? 'Zlozka' : (scope === 'unit' ? 'Utvar' : 'Centralny');
          const scopeHint = d.scopeOrgUnitName
            ? scopeLabel + ': ' + d.scopeOrgUnitName
            : scopeLabel;

          var orgSelectHtml = '';
          if (scope === 'branch') {

    function searchHighlightBanner() {
      if (!state.searchHighlight) return '';

      return '<div class="msg">Z hladania: <b>' + (h.title || h.id) + '</b> (' + typeLabelSk(h.entityType) + ')</div>';

    var UI_PALETTE = [
      '#0f4c6e', '#1a6f9a', '#2b7bb9', '#0d8f7a', '#3aa687',
      '#c47b1a', '#b42318', '#5a6d7e', '#6b4f9a', '#2d6a4f', '#9a3412'
    ];

    function paletteColor(index) {
      return UI_PALETTE[Math.abs(Number(index) || 0) % UI_PALETTE.length];
    }

    function colorForKey(key) {
      var s = String(key == null ? '' : key);
      var h = 0;
      for (var i = 0; i < s.length; i++) h = ((h << 5) - h) + s.charCodeAt(i);
      return paletteColor(Math.abs(h));
    }

    function levelColor(level) {
      var map = { 0: '#0f4c6e', 1: '#2b7bb9', 2: '#0d8f7a', 3: '#c47b1a', 4: '#6b4f9a' };
      return map[level] || paletteColor(level + 3);
    }

    function swatchHtml(color, cls) {
      return '<span class="swatch' + (cls ? ' ' + cls : '') +
        '" style="background:' + color + '"></span>';
    }

    function entityLabelHtml(text, key) {
      var color = colorForKey(key || text);
      return '<span class="entity-label">' + swatchHtml(color) +
        '<span>' + text + '</span></span>';
    }

    function pageHead(title, subtitle, chipsHtml, accent) {
      return '<div class="page-head"' + (accent ? ' style="--sky:' + accent + '"' : '') + '>' +
        '<div><h2>' + title + '</h2>' +
        (subtitle ? '<p class="muted">' + subtitle + '</p>' : '') +
        '</div>' +
        (chipsHtml ? '<div class="chip-row">' + chipsHtml + '</div>' : '') +
        '</div>';
    }

    function chipHtml(label, value, cls) {
      return '<span class="chip' + (cls ? ' ' + cls : '') + '">' + label +
        (value != null && value !== '' ? ' <b>' + value + '</b>' : '') + '</span>';
    }

    function makeTable(headers, rowsHtml, bare) {
      var html = '<table><thead><tr>' +
        headers.map(function (h) { return '<th>' + h + '</th>'; }).join('') +
        '</tr></thead><tbody>' + rowsHtml + '</tbody></table>';
      return bare ? html : '<div class="table-card table-scroll">' + html + '</div>';
    }

    function sectionCard(title, bodyHtml, accent) {
      return '<div class="section-card"' +
        (accent ? ' style="--section-accent:' + accent + '"' : '') + '>' +
        (title ? '<h2>' + title + '</h2>' : '') + bodyHtml + '</div>';
    }

    function renderFlightHoursPanel(title, totalHours, slices, subtitle, unitLabel) {
      var list = slices || [];
      var unit = unitLabel || 'hodin';
      if (!list.length) {
        return '<div class="chart-panel"><h2>' + title + '</h2>' +
          '<p class="muted">Zatial ziadne data.</p></div>';
      }
      var sum = list.reduce(function (a, s) { return a + Number(s.hours || 0); }, 0) || 1;
      var cx = 100, cy = 100, r = 78, r0 = 44;
      var angle = -Math.PI / 2;
      var paths = '';
      list.forEach(function (s, i) {
        var portion = Number(s.hours || 0) / sum;
        var a1 = angle;
        var a2 = angle + portion * Math.PI * 2;
        // veľmi malý výsek — stále klikateľný
        if (a2 - a1 < 0.02) a2 = a1 + 0.02;
        var x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
        var x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
        var xi1 = cx + r0 * Math.cos(a1), yi1 = cy + r0 * Math.sin(a1);
        var xi2 = cx + r0 * Math.cos(a2), yi2 = cy + r0 * Math.sin(a2);
        var large = (a2 - a1) > Math.PI ? 1 : 0;
        var d = 'M ' + x1.toFixed(2) + ' ' + y1.toFixed(2) +
          ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x2.toFixed(2) + ' ' + y2.toFixed(2) +
          ' L ' + xi2.toFixed(2) + ' ' + yi2.toFixed(2) +
          ' A ' + r0 + ' ' + r0 + ' 0 ' + large + ' 0 ' + xi1.toFixed(2) + ' ' + yi1.toFixed(2) + ' Z';
        var valText = unit === 'hodin'
          ? Number(s.hours).toFixed(1) + ' h'
          : String(Math.round(Number(s.hours))) + ' ' + unit;
        var pct = ((Number(s.hours || 0) / sum) * 100).toFixed(1);
        var tip = s.label + ' — ' + valText + ' (' + pct + ' %)';
        var sliceColor = colorForKey(s.key || s.label || i);
        paths += '<path class="pie-slice" data-idx="' + i + '" data-tip="' + tip.replace(/"/g, '&quot;') +
          '" data-color="' + sliceColor + '" d="' + d + '" fill="' +
          sliceColor + '"></path>';
        angle = a2;
      });
      var legend = list.map(function (s, i) {
        var val = unit === 'hodin' ? Number(s.hours).toFixed(1) + ' h' : String(Number(s.hours));
        var pct = ((Number(s.hours || 0) / sum) * 100).toFixed(1);
        var tip = s.label + ' — ' + val + (unit === 'hodin' ? '' : ' ' + unit) + ' (' + pct + ' %)';
        var sliceColor = colorForKey(s.key || s.label || i);
        return '<div class="pie-legend-row" data-idx="' + i + '" data-tip="' + tip.replace(/"/g, '&quot;') +
          '" data-color="' + sliceColor + '">' +
          '<span class="pie-swatch" style="background:' + sliceColor +
          '"></span><span>' + s.label + '</span><b>' + val + '</b></div>';
      }).join('');
      var centerVal = unit === 'hodin'
        ? Number(totalHours || sum).toFixed(1)
        : String(Math.round(Number(totalHours || sum)));
      return '<div class="chart-panel"><h2>' + title + '</h2>' +
        '<p class="muted" style="margin:0">' + (subtitle || '') + '</p>' +
        '<div class="pie-layout">' +
        '<svg viewBox="0 0 200 200" role="img" aria-label="' + title + '">' + paths +
        '<circle cx="100" cy="100" r="40" fill="#fff"/>' +
        '<text x="100" y="96" text-anchor="middle" class="pie-center-label">' +
        centerVal + '</text>' +
        '<text x="100" y="114" text-anchor="middle" class="pie-center-sub">' + unit + '</text>' +
        '</svg>' +
        '<div class="pie-legend">' + legend + '</div></div></div>';
    }

    function renderActivityBarsPanel(d) {
      var rows = [
        { label: 'Operacie dnes', value: d.operationsToday || 0, color: '#2b7bb9' },
        { label: 'Poruchy', value: d.openDefects || 0, color: '#c47b1a' },
        { label: 'Incidenty', value: d.openIncidents || 0, color: '#b42318' },
        { label: 'Neprecitane', value: d.unreadNotifications || 0, color: '#0d8f7a' },
        { label: 'UAS v prevadzke', value: (d.fleet && d.fleet.inService) || 0, color: '#0f4c6e' }
      ];
      var max = Math.max.apply(null, rows.map(function (r) { return r.value; }).concat([1]));
      var html = rows.map(function (r) {
        var pct = Math.max(4, Math.round((r.value / max) * 100));
        var tip = r.label + ': ' + r.value;
        return '<div class="bar-row" data-tip="' + tip.replace(/"/g, '&quot;') +
          '" data-color="' + r.color + '"><span>' + r.label + '</span>' +
          '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' +
          r.color + '"></div></div><b>' + r.value + '</b></div>';
      }).join('');
      return '<div class="chart-panel"><h2>Aktivita systemu</h2>' +
        '<p class="muted" style="margin:0">Prehlad klucovych ukazovatelov</p>' +
        '<div class="bar-chart">' + html + '</div></div>';
    }

    function bindChartTooltips(root) {
      var tip = document.getElementById('chart-tip');
      if (!tip) {
        tip = document.createElement('div');
        tip.id = 'chart-tip';
        tip.className = 'chart-tip';
        document.body.appendChild(tip);
      }
      function showTip(ev, el) {
        var text = el.getAttribute('data-tip') || '';
        var color = el.getAttribute('data-color') || '#2b7bb9';
        if (!text) return;
        tip.innerHTML = '<span class="tip-swatch" style="background:' + color + '"></span><strong>' +
          text.split(' — ')[0] + '</strong>' + (text.indexOf(' — ') >= 0 ? text.split(' — ').slice(1).join(' — ') : '');
        tip.classList.add('visible');
        var x = ev.clientX + 14;
        var y = ev.clientY + 14;
        if (x + 220 > window.innerWidth) x = ev.clientX - 220;
        if (y + 70 > window.innerHeight) y = ev.clientY - 60;
        tip.style.left = x + 'px';
        tip.style.top = y + 'px';
      }
      function hideTip() { tip.classList.remove('visible'); }

      root.querySelectorAll('.pie-layout').forEach(function (layout) {
        var slices = layout.querySelectorAll('.pie-slice');
        var rows = layout.querySelectorAll('.pie-legend-row');
        function setHot(idx) {
          layout.classList.add('is-hovering');
          slices.forEach(function (s) { s.classList.toggle('is-hot', s.getAttribute('data-idx') === idx); });
          rows.forEach(function (r) { r.classList.toggle('is-hot', r.getAttribute('data-idx') === idx); });
        }
        function clearHot() {
          layout.classList.remove('is-hovering');
          slices.forEach(function (s) { s.classList.remove('is-hot'); });
          rows.forEach(function (r) { r.classList.remove('is-hot'); });
        }
        function bindEl(el) {
          el.addEventListener('mouseenter', function (ev) {
            setHot(el.getAttribute('data-idx'));
            showTip(ev, el);
          });
          el.addEventListener('mousemove', function (ev) { showTip(ev, el); });
          el.addEventListener('mouseleave', function () {
            clearHot();
            hideTip();
          });
        }
        slices.forEach(bindEl);
        rows.forEach(bindEl);
      });

      root.querySelectorAll('.bar-row[data-tip]').forEach(function (el) {
        el.addEventListener('mouseenter', function (ev) { showTip(ev, el); });
        el.addEventListener('mousemove', function (ev) { showTip(ev, el); });
        el.addEventListener('mouseleave', hideTip);
      });

      root.querySelectorAll('.wx-chart').forEach(function (svg) {
        var focus = svg.querySelector('.wx-focus');
        var vline = svg.querySelector('.wx-vline');
        var dot = svg.querySelector('.wx-dot');
        svg.querySelectorAll('.wx-hit').forEach(function (hit) {
          hit.addEventListener('mouseenter', function (ev) {
            var x = hit.getAttribute('data-x');
            var y = hit.getAttribute('data-y');
            if (focus && vline && dot) {
              focus.style.display = '';
              vline.setAttribute('x1', x);
              vline.setAttribute('x2', x);
              dot.setAttribute('cx', x);
              dot.setAttribute('cy', y);
            }
            showTip(ev, hit);
          });
          hit.addEventListener('mousemove', function (ev) { showTip(ev, hit); });
          hit.addEventListener('mouseleave', function () {
            if (focus) focus.style.display = 'none';
            hideTip();
          });
        });
      });
    }

    function renderWeatherChart(hourly) {
      var pts = (hourly || []).slice(0, 24);
      if (!pts.length) return '<p class="muted">Graf nedostupny</p>';
      var w = 560, h = 168, padL = 38, padR = 36, padT = 12, padB = 26;
      var temps = pts.map(function (p) { return Number(p.temperatureC); });
      var winds = pts.map(function (p) { return Number(p.windSpeedMs); });
      var tMin = Math.min.apply(null, temps);
      var tMax = Math.max.apply(null, temps);
      var vMin = Math.floor(tMin) - 1;
      var vMax = Math.ceil(tMax) + 1;
      if (vMax <= vMin) vMax = vMin + 4;
      var wMin = Math.min.apply(null, winds);
      var wMax = Math.max.apply(null, winds);
      var wPad = Math.max(0.4, (wMax - wMin) * 0.15);
      wMin = Math.max(0, wMin - wPad);
      wMax = wMax + wPad;
      if (wMax <= wMin) wMax = wMin + 2;

      function xAt(i) {
        return padL + (i / Math.max(pts.length - 1, 1)) * (w - padL - padR);
      }
      function yTemp(v) {
        return padT + (1 - (v - vMin) / (vMax - vMin || 1)) * (h - padT - padB);
      }
      function yWind(v) {
        return padT + (1 - (v - wMin) / (wMax - wMin || 1)) * (h - padT - padB);
      }

      var tempPath = temps.map(function (v, i) {
        return (i === 0 ? 'M' : 'L') + xAt(i).toFixed(1) + ' ' + yTemp(v).toFixed(1);
      }).join(' ');
      var windPath = winds.map(function (v, i) {
        return (i === 0 ? 'M' : 'L') + xAt(i).toFixed(1) + ' ' + yWind(v).toFixed(1);
      }).join(' ');
      var area = tempPath + ' L' + xAt(pts.length - 1).toFixed(1) + ' ' + (h - padB).toFixed(1) +
        ' L' + padL.toFixed(1) + ' ' + (h - padB).toFixed(1) + ' Z';

      var yTicks = '';
      var tickCount = 4;
      for (var ti = 0; ti <= tickCount; ti++) {
        var tv = vMin + (vMax - vMin) * (ti / tickCount);
        var wv = wMin + (wMax - wMin) * (ti / tickCount);
        var yy = yTemp(tv);
        yTicks += '<line x1="' + padL + '" y1="' + yy.toFixed(1) + '" x2="' + (w - padR) +
          '" y2="' + yy.toFixed(1) + '" stroke="#e2eaf0" stroke-width="1"/>';
        yTicks += '<text x="' + (padL - 6) + '" y="' + (yy + 3).toFixed(1) +
          '" text-anchor="end" fill="#2b7bb9" font-size="10" font-weight="600">' +
          Math.round(tv) + '°</text>';
        yTicks += '<text x="' + (w - padR + 6) + '" y="' + (yy + 3).toFixed(1) +
          '" text-anchor="start" fill="#0d8f7a" font-size="10" font-weight="600">' +
          wv.toFixed(1) + '</text>';
      }

      var xLabels = '';
      for (var i = 0; i < pts.length; i += 4) {
        var hh = new Date(pts[i].at).toLocaleTimeString('sk-SK', { hour: '2-digit', minute: '2-digit' });
        xLabels += '<text x="' + xAt(i).toFixed(1) + '" y="' + (h - 8) +
          '" text-anchor="middle" fill="#5a6d7e" font-size="10">' + hh + '</text>';
      }

      var dots = '';
      var hits = '';
      pts.forEach(function (p, i) {
        var time = new Date(p.at).toLocaleTimeString('sk-SK', { hour: '2-digit', minute: '2-digit' });
        var tip = time + ' — ' + Number(p.temperatureC).toFixed(1) + '°C · vietor ' +
          Number(p.windSpeedMs).toFixed(1) + ' m/s';
        var cx = xAt(i).toFixed(1);
        var cy = yTemp(p.temperatureC).toFixed(1);
        if (i % 2 === 0) {
          dots += '<circle cx="' + cx + '" cy="' + cy + '" r="2.4" fill="#2b7bb9"/>';
        }
        hits += '<circle class="wx-hit" cx="' + cx + '" cy="' + cy + '" r="11" fill="transparent" ' +
          'data-tip="' + tip.replace(/"/g, '&quot;') + '" data-color="#2b7bb9" ' +
          'data-x="' + cx + '" data-y="' + cy + '"></circle>';
      });

      var gid = 'tempFill-' + Math.abs(Math.round((temps[0] || 0) * 100 + pts.length));
      return '<svg class="wx-chart" viewBox="0 0 ' + w + ' ' + h +
        '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="SHMU teplota a vietor">' +
        '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="#2b7bb9" stop-opacity="0.32"/>' +
        '<stop offset="100%" stop-color="#2b7bb9" stop-opacity="0.03"/>' +
        '</linearGradient></defs>' +
        yTicks +
        '<path d="' + area + '" fill="url(#' + gid + ')"/>' +
        '<path d="' + tempPath + '" fill="none" stroke="#2b7bb9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' +
        '<path d="' + windPath + '" fill="none" stroke="#0d8f7a" stroke-width="2.1" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/>' +
        dots +
        '<g class="wx-focus" style="display:none">' +
        '<line class="wx-vline" x1="0" y1="' + padT + '" x2="0" y2="' + (h - padB) +
        '" stroke="#0f4c6e" stroke-width="1.2" stroke-dasharray="3 3"/>' +
        '<circle class="wx-dot" cx="0" cy="0" r="4.5" fill="#2b7bb9" stroke="#fff" stroke-width="1.8"/>' +
        '</g>' +
        xLabels +
        hits +
        '</svg>';
    }

    function renderWeatherPanel(w) {
      if (!w) {
        return '<div class="weather-panel"><h2>SHMU pocasie</h2>' +
          '<p class="muted">Pocasie momentalne nedostupne.</p></div>';
      }
      var observed = new Date(w.observedAt).toLocaleString('sk-SK');
      var valid = new Date(w.validUntil).toLocaleTimeString('sk-SK', { hour: '2-digit', minute: '2-digit' });
      return '<div class="weather-panel">' +
        '<div class="weather-head">' +
        '<div><h2>SHMU pocasie</h2><p class="muted" style="margin:0.2rem 0 0">' +
        w.stationName + ' · ' + w.conditionLabel + '</p></div>' +
        '<div class="weather-source">' + w.sourceLabel + '<br/>meranie ' + observed +
        '<br/>platne do ' + valid + '</div></div>' +
        '<div class="weather-now">' +
        '<div class="weather-temp">' + w.temperatureC.toFixed(1) + '°C' +
        '<small>pocitovo ' + w.feelsLikeC.toFixed(1) + '°C</small></div>' +
        '<div class="weather-kpis">' +
        '<div>Vietor <strong>' + w.windSpeedMs.toFixed(1) + ' m/s</strong></div>' +
        '<div>Narazy <strong>' + w.windGustMs.toFixed(1) + ' m/s</strong></div>' +
        '<div>Vlhkost <strong>' + w.relativeHumidityPct + ' %</strong></div>' +
        '<div>Tlak <strong>' + w.pressureHpa.toFixed(0) + ' hPa</strong></div>' +
        '</div></div>' +
        '<div class="weather-advice">' + w.flightAdvice + '</div>' +
        '<div class="weather-chart-wrap">' + renderWeatherChart(w.hourly) +
        '<div class="weather-legend"><span><i class="leg-temp"></i>Teplota (°C)</span>' +
        '<span><i class="leg-wind"></i>Vietor (m/s)</span></div></div></div>';
    }

    function confirmAction(message) {
      return window.confirm(message || 'Pokracovat?');
    }

    function typeLabelSk(text) {
      return statusLabelSk(text);
    }

    function severityLabelSk(value, kind) {
      var n = Number(value);
      if (!isNaN(n) && String(value).trim() !== '') {
        var byNum = { 0: 'Nízka', 1: 'Stredná', 2: 'Vysoká', 3: kind === 'defect' ? 'Blokujúca' : 'Kritická' };
        if (byNum[n] != null) return byNum[n];
      }
      return statusLabelSk(value);
    }

    function statusBadge(text) {
      var raw = (text == null ? '' : String(text));
      var key = raw.replace(/\s+/g, '').toLowerCase();
      var cls = 'badge';
      if (/inservice|active|approved|closed|resolved|sent|clear|ok|compliant|frozen|completed|verified|low|processed|eligible|registered|available|done|success|read|published|realized/.test(key)) cls += ' badge-ok';
      else if (/draft|open|reported|pending|submitted|underrepair|high|warn|planned|inprogress|findingsreview|medium|urgent|returned|ready|received|normal|info|needspairing|unread|underinvestigation|actionsinprogress|new|assessed|conditional/.test(key)) cls += ' badge-warn';
      else if (/suspended|critical|rejected|cancelled|overdue|conflict|revoked|danger|noncompliant|blocking|failed|deactivated|noteligible|failure|denied|error|incompatible|withdrawn/.test(key)) cls += ' badge-danger';
      return '<span class="' + cls + '">' + statusLabelSk(raw) + '</span>';
    }

    function severityBadge(value, kind) {
      var label = severityLabelSk(value, kind);
      var raw = (value == null ? '' : String(value));
      var key = raw.replace(/\s+/g, '').toLowerCase();
      var n = Number(value);
      var cls = 'badge';
      if (n === 0 || /low/.test(key)) cls += ' badge-ok';
      else if (n === 1 || n === 2 || /medium|high/.test(key)) cls += ' badge-warn';
      else if (n === 3 || /critical|blocking/.test(key)) cls += ' badge-danger';
      return '<span class="' + cls + '">' + label + '</span>';
    }

    async function showHistory(entityType, entityId, containerEl) {
      if (!containerEl) return;
      containerEl.classList.remove('hidden');
      containerEl.innerHTML = '<h4>Historia</h4><p class="muted">Nacitavam...</p>';
      try {
        var q = '/api/v1/audit-events?entityType=' + encodeURIComponent(entityType) +
          '&entityId=' + encodeURIComponent(entityId);
        var events = await api(q);
        if (!events || !events.length) {
          containerEl.innerHTML = '<h4>História — ' + typeLabelSk(entityType) + '</h4><p class="muted">Žiadne audit záznamy.</p>';
          return;
        }
        var rows = events.slice(0, 40).map(function (e) {
          return '<tr><td>' + new Date(e.occurredAt).toLocaleString('sk-SK') +
            '</td><td>' + (e.actorUserName || '—') +
            '</td><td>' + typeLabelSk(e.action) +
            '</td><td>' + statusBadge(e.result) + '</td></tr>';
        }).join('');
        containerEl.innerHTML = '<h4>História — ' + typeLabelSk(entityType) + '</h4>' +
          makeTable(['Čas', 'Aktér', 'Akcia', 'Výsledok'], rows);
      } catch (err) {
        containerEl.innerHTML = '<h4>Historia</h4><div class="error">' + err.message + '</div>';
      }
    }

    /** Formuláre sú skryté; tlačidlá data-reveal / data-hide ich otvárajú a zatvárajú. */
    function bindFormReveals() {
      content.querySelectorAll('[data-reveal]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.getAttribute('data-reveal');
          var panel = document.getElementById(id);
          if (!panel) return;
          var willOpen = panel.classList.contains('hidden');
          content.querySelectorAll('.form-panel').forEach(function (p) { p.classList.add('hidden'); });
          if (willOpen) panel.classList.remove('hidden');
        });
      });
      content.querySelectorAll('[data-hide]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var panel = document.getElementById(btn.getAttribute('data-hide'));
          if (panel) panel.classList.add('hidden');
        });
      });
    }

    async function loadUasOptions(pageSize) {
      try {
        const size = pageSize || 50;
        const uasData = await api('/api/v1/uas?page=1&pageSize=' + size);
        return uasData.items || uasData.Items || [];
      } catch (err) {
        console.warn('UAS list', err);
        return [];
      }
    }

    function uasSelectHtml(uasList, emptyLabel) {
      if (!uasList.length) {
        return '<option value="">' + (emptyLabel || '(ziadne UAS v databaze)') + '</option>';
      }
      return uasList.map(function (u) {
        return '<option value="' + u.id + '">' + (u.registrationNumber || u.serialNumber) +
          ' — ' + u.manufacturer + ' ' + u.model + ' (' + statusLabelSk(u.status) + ')</option>';
      }).join('');
    }

    async function createDemoUas() {
      const orgs = await api('/api/v1/org-units');
      const unit = orgs.find(function (o) { return o.code === 'UTVAR-A'; }) || orgs[0];
      const sn = 'UI-' + Date.now().toString().slice(-8);
      return api('/api/v1/uas', {
        method: 'POST',
        body: JSON.stringify({
          serialNumber: sn,
          manufacturer: 'DJI',
          model: 'M300',
          uasTypeCode: 'MULTI_ROTOR',
          owningOrgUnitId: unit.id,
          notes: 'Vytvorene z UI'
        })
      });
    }

    async function ensureMapLibs() {
      if (window.L && window.L.esri && window.IsSuasDroneMap) return;
      function loadScript(src) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement('script');
          s.src = src;
          s.async = true;
          s.onload = resolve;
          s.onerror = function () { reject(new Error('Nepodarilo sa nacitat ' + src)); };
          document.head.appendChild(s);
        });
      }
      if (!window.L) {
        await loadScript('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js');
      }
      if (!window.L.esri) {
        await loadScript('https://unpkg.com/esri-leaflet@3.0.12/dist/esri-leaflet.js');
      }
      if (!window.IsSuasDroneMap) {
        await loadScript('/js/dronemap.js');
      }
    }

    // Stary token po reštarte API nefunguje — vzdy ukaz login (okrem SSO callback)
    localStorage.removeItem('issuas.token');
    localStorage.removeItem('issuas.name');
    state.token = null;
    completeSsoCallbackFromUrl().then(function (handled) {
      if (!handled) showLogin();
    });
  </script>
