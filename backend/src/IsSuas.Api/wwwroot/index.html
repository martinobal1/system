<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IS SUAS</title>
  <style>
    :root {
      --bg: #eef3f7;
      --panel: #ffffff;
      --ink: #1a2b3c;
      --muted: #5b6b7c;
      --primary: #1b4f72;
      --line: #d5dee7;
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    .login-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, #dbe7f1, #f4f7fa 55%, #eef3f7);
    }
    .login-card {
      width: min(420px, 92vw);
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 2rem;
      display: grid;
      gap: 0.85rem;
    }
    .brand { margin: 0; font-size: 1.75rem; font-weight: 700; color: var(--primary); }
    .login-card h1 { margin: 0; font-size: 1.25rem; }
    .muted, .hint { color: var(--muted); margin: 0; }
    label { display: grid; gap: 0.35rem; }
    input, button { font: inherit; }
    input { border: 1px solid var(--line); padding: 0.7rem 0.8rem; }
    button {
      border: 0;
      background: var(--primary);
      color: #fff;
      padding: 0.75rem 1rem;
      cursor: pointer;
      font-weight: 600;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .error {
      color: var(--danger);
      margin: 0;
      padding: 0.6rem 0.75rem;
      background: #fdecea;
      border: 1px solid #f5c2c0;
    }
    .app { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
    .sidebar { background: #13293d; color: #eaf2f8; padding: 1.25rem 0.75rem; }
    .sidebar-brand { font-weight: 700; font-size: 1.25rem; padding: 0.5rem 0.75rem 1.25rem; }
    .sidebar nav { display: grid; gap: 0.25rem; }
    .nav {
      background: transparent;
      color: #d7e3ee;
      text-align: left;
      font-weight: 500;
    }
    .nav.active, .nav:hover { background: rgba(255,255,255,0.1); }
    main { display: grid; grid-template-rows: auto 1fr; }
    .topbar {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.9rem 1.25rem;
    }
    .userbox { display: flex; gap: 0.75rem; align-items: center; }
    #logout-btn {
      background: transparent;
      color: var(--primary);
      border: 1px solid var(--line);
    }
    .content { padding: 1.25rem; }
    .panel, table {
      background: var(--panel);
      border: 1px solid var(--line);
    }
    .panel { padding: 1rem; }
    .stack { display: grid; gap: 1rem; }
    h2 { margin: 0 0 0.75rem; font-size: 1.4rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      padding: 0.7rem 0.8rem;
      border-bottom: 1px solid var(--line);
    }
    th { background: #f7fafc; }
    .msg {
      padding: 0.75rem 0.9rem;
      border: 1px solid var(--line);
      background: #eaf4fb;
    }
    .hidden { display: none !important; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 0.25rem; }
    .form-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 1rem;
      display: grid;
      gap: 0.75rem;
    }
    .form-panel h3 { margin: 0; font-size: 1.05rem; color: var(--primary); }
    .form-grid {
      display: grid;
      gap: 0.75rem;
      grid-template-columns: 1fr 1fr;
    }
    .form-grid .full { grid-column: 1 / -1; }
    .form-grid label { font-size: 0.9rem; }
    select, textarea {
      font: inherit;
      border: 1px solid var(--line);
      padding: 0.65rem 0.75rem;
      width: 100%;
    }
    textarea { min-height: 90px; resize: vertical; }
    button.secondary {
      background: transparent;
      color: var(--primary);
      border: 1px solid var(--line);
    }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.75rem;
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 0.9rem;
    }
    .stat .n { font-size: 1.6rem; font-weight: 700; color: var(--primary); }
    .stat .l { color: var(--muted); font-size: 0.85rem; }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--line);
      background: #f0f4f8;
      color: var(--ink);
      white-space: nowrap;
    }
    .badge-ok, .badge-inservice, .badge-active, .badge-approved, .badge-closed, .badge-resolved, .badge-sent { background: #e8f6ef; border-color: #b7e0c8; color: #0d6b3c; }
    .badge-warn, .badge-draft, .badge-open, .badge-reported, .badge-pending, .badge-submitted { background: #fff7e6; border-color: #f0d9a8; color: #8a5a00; }
    .badge-danger, .badge-suspended, .badge-critical, .badge-rejected, .badge-cancelled, .badge-overdue { background: #fdecea; border-color: #f5c2c0; color: var(--danger); }
    .history-panel {
      background: #f7fafc;
      border: 1px solid var(--line);
      padding: 0.75rem;
      font-size: 0.9rem;
      max-height: 240px;
      overflow: auto;
    }
    .history-panel h4 { margin: 0 0 0.5rem; font-size: 0.95rem; color: var(--primary); }
    @media (max-width: 800px) {
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="login-view" class="login-shell">
    <form id="login-form" class="login-card">
      <p class="brand">IS SUAS</p>
      <h1>Prihlasenie</h1>
      <p class="muted">Informacny system statnych bezpilotnych leteckych systemov</p>
      <label>Pouzivatelske meno
        <input id="username" value="gestor" autocomplete="username" required />
      </label>
      <label>Heslo
        <input id="password" type="password" value="Heslo123!" autocomplete="current-password" required />
      </label>
      <p id="login-error" class="error hidden"></p>
      <button id="login-btn" type="submit">Prihlasit sa</button>
      <button id="sso-btn" type="button" class="secondary">SSO (DEV)</button>
      <p class="hint">Demo: gestor / Heslo123!</p>
      <p class="hint">SSO DEV: callback code=dev-sso:gestor</p>
      <p class="hint">Ak sa nic nedeje, API nebezi. V terminali musi byt: Now listening on http://localhost:5211</p>
    </form>
  </div>

  <div id="app-view" class="app hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">IS SUAS</div>
      <nav>
        <button type="button" data-page="dashboard" class="nav active">Prehlad</button>
        <button type="button" data-page="orgs" class="nav">Organizacna struktura</button>
        <button type="button" data-page="accounts" class="nav">Pouzivatelia</button>
        <button type="button" data-page="delegations" class="nav">Delegacie</button>
        <button type="button" data-page="pilots" class="nav">Piloti</button>
        <button type="button" data-page="operations" class="nav">Operacie</button>
        <button type="button" data-page="flights" class="nav">Lety</button>
        <button type="button" data-page="maintenance" class="nav">Udrzba</button>
        <button type="button" data-page="defects" class="nav">Poruchy</button>
        <button type="button" data-page="incidents" class="nav">Incidenty</button>
        <button type="button" data-page="documents" class="nav">Dokumenty</button>
        <button type="button" data-page="reports" class="nav">Reporty</button>
        <button type="button" data-page="calendar" class="nav">Kalendar</button>
        <button type="button" data-page="admin" class="nav">Administracia</button>
        <button type="button" data-page="tasks" class="nav">Ulohy</button>
        <button type="button" data-page="controls" class="nav">Kontroly</button>
        <button type="button" data-page="uas" class="nav">Register UAS</button>
        <button type="button" data-page="components" class="nav">Komponenty</button>
        <button type="button" data-page="batteries" class="nav">Baterie</button>
      </nav>
    </aside>
    <main>
      <header class="topbar">
        <div id="page-title">Prehlad</div>
        <div class="userbox">
          <form id="global-search-form" class="toolbar" style="margin:0;gap:0.35rem">
            <input id="global-search-q" type="search" placeholder="Hladat..." style="min-width:160px;padding:0.45rem 0.6rem" />
            <button type="submit" class="secondary" id="global-search-btn" style="padding:0.45rem 0.75rem">Hladat</button>
          </form>
          <span id="display-name"></span>
          <button id="logout-btn" type="button">Odhlasit</button>
        </div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>

  <script>
    const state = {
      token: localStorage.getItem('issuas.token'),
      displayName: localStorage.getItem('issuas.name') || ''
    };

    const loginView = document.getElementById('login-view');
    const appView = document.getElementById('app-view');
    const content = document.getElementById('content');
    const pageTitle = document.getElementById('page-title');
    const displayNameEl = document.getElementById('display-name');
    const loginError = document.getElementById('login-error');
    const loginBtn = document.getElementById('login-btn');

    function showError(msg) {
      loginError.textContent = msg;
      loginError.classList.remove('hidden');
    }

    async function api(path, options = {}) {
      const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
      if (state.token) headers.Authorization = 'Bearer ' + state.token;

      let res;
      try {
        res = await fetch(path, { ...options, headers });
      } catch (e) {
        throw new Error('Nepodarilo sa spojit s API. Spustite: dotnet run --project src/IsSuas.Api a nechajte terminal otvoreny.');
      }

      if (res.status === 401) {
        if (!path.includes('/auth/login')) logout(false);
        let detail = 'Neplatne prihlasovacie udaje';
        try {
          const body = await res.json();
          detail = body.detail || body.title || detail;
        } catch {}
        throw new Error(detail);
      }

      if (!res.ok) {
        let detail = 'Chyba ' + res.status;
        try {
          const body = await res.json();
          detail = body.detail || body.title || detail;
        } catch {}
        throw new Error(detail);
      }

      if (res.status === 204) return null;
      return res.json();
    }

    function showApp() {
      loginView.classList.add('hidden');
      appView.classList.remove('hidden');
      displayNameEl.textContent = state.displayName;
      navigate('dashboard');
    }

    function showLogin() {
      appView.classList.add('hidden');
      loginView.classList.remove('hidden');
    }

    function logout(clearStorage = true) {
      state.token = null;
      state.displayName = '';
      if (clearStorage) {
        localStorage.removeItem('issuas.token');
        localStorage.removeItem('issuas.name');
      }
      showLogin();
    }

    document.getElementById('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      loginError.classList.add('hidden');
      loginBtn.disabled = true;
      loginBtn.textContent = 'Prihlasujem...';
      try {
        const body = {
          userName: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value
        };
        const res = await api('/api/v1/auth/login', {
          method: 'POST',
          body: JSON.stringify(body)
        });
        state.token = res.accessToken;
        state.displayName = res.displayName;
        localStorage.setItem('issuas.token', state.token);
        localStorage.setItem('issuas.name', state.displayName);
        showApp();
      } catch (err) {
        showError(err.message || 'Prihlasenie zlyhalo');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Prihlasit sa';
      }
    });

    document.getElementById('sso-btn').addEventListener('click', async function () {
      loginError.classList.add('hidden');
      try {
        const sso = await api('/api/v1/auth/sso/start?returnUrl=/');
        if (sso.redirectUrl) {
          window.location.href = sso.redirectUrl;
          return;
        }
        showError(sso.message || 'SSO nie je dostupne');
      } catch (err) {
        showError(err.message || 'SSO zlyhalo');
      }
    });

    async function completeSsoCallbackFromUrl() {
      var path = window.location.pathname || '';
      if (path.indexOf('/auth/callback') < 0) return false;
      var params = new URLSearchParams(window.location.search);
      var code = params.get('code');
      if (!code) {
        showError('SSO callback: chýba code');
        return true;
      }
      try {
        var q = '/api/v1/auth/sso/callback?code=' + encodeURIComponent(code);
        var stateParam = params.get('state');
        if (stateParam) q += '&state=' + encodeURIComponent(stateParam);
        var res = await api(q);
        state.token = res.accessToken;
        state.displayName = res.displayName;
        localStorage.setItem('issuas.token', state.token);
        localStorage.setItem('issuas.name', state.displayName);
        window.history.replaceState({}, '', '/');
        showApp();
      } catch (err) {
        showError(err.message || 'SSO callback zlyhal');
      }
      return true;
    }

    document.getElementById('logout-btn').addEventListener('click', function () {
      logout(true);
    });

    document.querySelectorAll('.nav').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.nav').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        navigate(btn.dataset.page);
      });
    });

    const titles = {
      dashboard: 'Prehlad',
      orgs: 'Organizacna struktura',
      accounts: 'Pouzivatelia',
      delegations: 'Delegacie opravneni',
      pilots: 'Piloti',
      operations: 'Operacie',
      flights: 'Lety',
      maintenance: 'Udrzba',
      defects: 'Poruchy',
      incidents: 'Incidenty',
      documents: 'Dokumenty',
      reports: 'Reporty',
      calendar: 'Kalendar',
      admin: 'Administracia',
      tasks: 'Ulohy',
      controls: 'Kontroly a audity',
      uas: 'Register UAS',
      components: 'Komponenty',
      batteries: 'Baterie',
      search: 'Vysledky hladania'
    };

    document.getElementById('global-search-form').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var q = document.getElementById('global-search-q').value.trim();
      state.searchQuery = q;
      document.querySelectorAll('.nav').forEach(function (b) { b.classList.remove('active'); });
      navigate('search');
    });

    async function navigate(page) {
      pageTitle.textContent = titles[page] || page;
      content.innerHTML = '<div class="panel">Nacitavam...</div>';
      try {
        if (page === 'search') {
          const q = (state.searchQuery || '').trim();
          document.getElementById('global-search-q').value = q;
          if (q.length < 2) {
            content.innerHTML = '<div class="stack"><div class="msg">Zadajte aspon 2 znaky do hladania v hornom paneli.</div></div>';
            return;
          }
          const res = await api('/api/v1/search?q=' + encodeURIComponent(q) + '&limit=8');
          const hits = res.hits || [];
          if (!hits.length) {
            content.innerHTML = '<div class="stack"><div class="msg">Ziadne vysledky pre „' + q.replace(/</g, '') + '“.</div></div>';
            return;
          }
          const typeLabels = {
            Uas: 'UAS',
            Pilot: 'Piloti',
            Operation: 'Operacie',
            Account: 'Ucty',
            SafetyEvent: 'Incidenty',
            ControlAudit: 'Kontroly'
          };
          const groups = {};
          hits.forEach(function (h) {
            if (!groups[h.entityType]) groups[h.entityType] = [];
            groups[h.entityType].push(h);
          });
          var html = '<div class="stack"><div class="msg">Hladanie: <b>' + q.replace(/</g, '') +
            '</b> — ' + hits.length + ' vysledkov</div>';
          Object.keys(groups).forEach(function (type) {
            html += '<h2>' + (typeLabels[type] || type) + '</h2>';
            html += groups[type].map(function (h) {
              return '<button type="button" class="search-hit secondary" data-type="' + h.entityType +
                '" data-id="' + h.id + '" style="display:block;width:100%;text-align:left;margin-bottom:0.4rem">' +
                '<strong>' + h.title + '</strong> ' + statusBadge(h.status || '') +
                '<div class="muted">' + (h.subtitle || '') +
                (h.orgUnitName ? ' · ' + h.orgUnitName : '') + '</div></button>';
            }).join('');
          });
          html += '</div>';
          content.innerHTML = html;
          content.querySelectorAll('.search-hit').forEach(function (btn) {
            btn.onclick = function () {
              openSearchHit(btn.dataset.type, btn.dataset.id, btn.querySelector('strong').textContent);
            };
          });
          return;
        }
        if (page === 'dashboard') {
          const orgs = await api('/api/v1/org-units');
          const scope = state.dashboardScope || 'central';
          let selectedOrg = (typeof state.dashboardOrgUnitId === 'string') ? state.dashboardOrgUnitId : '';
          const branchOrgs = orgs.filter(function (o) { return o.level === 1; });
          const unitOrgs = orgs.filter(function (o) { return o.level >= 2; });
          if (scope === 'branch' && !selectedOrg && branchOrgs.length)
            selectedOrg = branchOrgs[0].id;
          if (scope === 'unit' && !selectedOrg && unitOrgs.length)
            selectedOrg = unitOrgs[0].id;

          var dashUrl = '/api/v1/dashboard?scope=' + encodeURIComponent(scope);
          if (scope !== 'central' && selectedOrg)
            dashUrl += '&orgUnitId=' + encodeURIComponent(selectedOrg);

          const d = await api(dashUrl);
          state.dashboardOrgUnitId = selectedOrg;

          const scopeLabel = scope === 'branch' ? 'Zlozka' : (scope === 'unit' ? 'Utvar' : 'Centralny');
          const scopeHint = d.scopeOrgUnitName
            ? scopeLabel + ': ' + d.scopeOrgUnitName
            : scopeLabel;

          var orgSelectHtml = '';
          if (scope === 'branch') {
            const opts = branchOrgs.map(function (o) {
              return '<option value="' + o.id + '"' + (o.id === selectedOrg ? ' selected' : '') + '>' +
                o.code + ' — ' + o.name + '</option>';
            }).join('');
            orgSelectHtml = '<label style="display:flex;gap:0.5rem;align-items:center">Zlozka ' +
              '<select id="dash-org" style="width:auto;min-width:220px">' + opts + '</select></label>';
          } else if (scope === 'unit') {
            const opts = unitOrgs.map(function (o) {
              return '<option value="' + o.id + '"' + (o.id === selectedOrg ? ' selected' : '') + '>' +
                o.code + ' — ' + o.name + '</option>';
            }).join('');
            orgSelectHtml = '<label style="display:flex;gap:0.5rem;align-items:center">Utvar ' +
              '<select id="dash-org" style="width:auto;min-width:220px">' + opts + '</select></label>';
          }

          const upcoming = (d.upcomingOperations || []).map(function (o) {
            return '<tr><td>' + o.title + '</td><td>' + statusBadge(o.status) + '</td><td>' + o.orgUnitName +
              '</td><td>' + new Date(o.start).toLocaleString('sk-SK') + '</td></tr>';
          }).join('') || '<tr><td colspan="4">Ziadne bliziace sa operacie</td></tr>';
          const alerts = (d.criticalAlerts || []).map(function (a) {
            return '<tr><td>' + statusBadge(a.priority) + '</td><td>' + a.typeCode + '</td><td>' + a.title + '</td></tr>';
          }).join('') || '<tr><td colspan="3">Ziadne kriticke upozornenia</td></tr>';
          content.innerHTML =
            '<div class="stack">' +
            '<div class="msg">Vitajte, ' + state.displayName + ' (rola: ' + d.roleHint + ') — ' + scopeHint + '</div>' +
            '<div class="toolbar">' +
            '<button type="button" class="secondary dash-scope" data-scope="central"' + (scope === 'central' ? ' disabled' : '') + '>Centralny</button>' +
            '<button type="button" class="secondary dash-scope" data-scope="branch"' + (scope === 'branch' ? ' disabled' : '') + '>Zlozka</button>' +
            '<button type="button" class="secondary dash-scope" data-scope="unit"' + (scope === 'unit' ? ' disabled' : '') + '>Utvar</button>' +
            orgSelectHtml +
            '</div>' +
            '<div class="stat-grid">' +
            '<div class="stat"><div class="n">' + d.fleet.totalUas + '</div><div class="l">UAS celkom</div></div>' +
            '<div class="stat"><div class="n">' + d.fleet.inService + '</div><div class="l">V prevadzke</div></div>' +
            '<div class="stat"><div class="n">' + d.fleet.suspended + '</div><div class="l">Pozastavene</div></div>' +
            '<div class="stat"><div class="n">' + d.operationsToday + '</div><div class="l">Operacie dnes</div></div>' +
            '<div class="stat"><div class="n">' + d.openTasks + '</div><div class="l">Otvorene ulohy</div></div>' +
            '<div class="stat"><div class="n">' + d.openDefects + '</div><div class="l">Poruchy</div></div>' +
            '<div class="stat"><div class="n">' + d.openIncidents + '</div><div class="l">Incidenty</div></div>' +
            '<div class="stat"><div class="n">' + d.overdueMaintenance + '</div><div class="l">Udrzba overdue</div></div>' +
            '<div class="stat"><div class="n">' + d.unreadNotifications + '</div><div class="l">Neprecitane</div></div>' +
            '</div>' +
            '<h2>Najblizsie operacie</h2>' +
            makeTable(['Nazov', 'Stav', 'Utvar', 'Zaciatok'], upcoming) +
            '<h2>Kriticke upozornenia</h2>' +
            makeTable(['Priorita', 'Typ', 'Nazov'], alerts) +
            '</div>';
          content.querySelectorAll('.dash-scope').forEach(function (btn) {
            btn.onclick = function () {
              state.dashboardScope = btn.dataset.scope;
              state.dashboardOrgUnitId = '';
              navigate('dashboard');
            };
          });
          var orgEl = document.getElementById('dash-org');
          if (orgEl) {
            orgEl.onchange = function () {
              state.dashboardOrgUnitId = this.value || '';
              navigate('dashboard');
            };
          }
          return;
        }
        if (page === 'delegations') {
          let items = [];
          let accounts = [];
          try {
            items = await api('/api/v1/delegations');
          } catch (err) {
            content.innerHTML = '<div class="error">' + err.message + '</div>';
            return;
          }
          try {
            accounts = await api('/api/v1/accounts');
          } catch (_) { /* optional for create */ }

          const permOpts = [
            'integrations.read', 'reports.write', 'uas.read', 'operations.read',
            'documents.read', 'pilots.read', 'accounts.read'
          ].map(function (p) {
            return '<option value="' + p + '">' + p + '</option>';
          }).join('');
          const accountOpts = accounts.map(function (a) {
            return '<option value="' + a.id + '">' + a.userName +

                })
              });
              msg.innerHTML = '<div class="msg">Kontrola vytvorena v stave Planned. Spustite ju zo zoznamu alebo detailu.</div>';
              state.controlDetailId = created.id;
              navigate('controls');
            } catch (err) { msg.innerHTML = '<div class="error">' + err.message + '</div>'; }
          };
          document.querySelectorAll('.open-ctrl').forEach(function (btn) {
            btn.onclick = function () {
              state.controlDetailId = btn.dataset.id;
              navigate('controls');
            };
          });
          document.querySelectorAll('.start-ctrl').forEach(function (btn) {
            btn.onclick = async function () {
              if (!confirmAction('Spustit kontrolu?')) return;
              const msg = document.getElementById('ctrl-msg');
              try {
                await api('/api/v1/control-audits/' + btn.dataset.id + '/start', {
                  method: 'POST',
                  body: JSON.stringify({ rowVersion: Number(btn.dataset.rv) })
                });
                state.controlDetailId = btn.dataset.id;
                navigate('controls');
              } catch (err) { msg.innerHTML = '<div class="error">' + err.message + '</div>'; }
            };
          });
          return;
        }
        if (page === 'uas') {
          const data = await api('/api/v1/uas?page=1&pageSize=50');
          const rows = (data.items || []).map(function (u) {
            return '<tr><td>' + (u.registrationNumber || '-') + '</td><td>' + u.serialNumber +
              '</td><td>' + u.manufacturer + ' ' + u.model + '</td><td>' + u.status + '</td></tr>';
          }).join('') || '<tr><td colspan="4">Zatial ziadne UAS</td></tr>';
          content.innerHTML = '<div class="stack">' + searchHighlightBanner() + '<h2>Register UAS</h2>' +
            makeTable(['Evid. oznacenie', 'Vyrobne cislo', 'Vyrobca / model', 'Stav'], rows) + '</div>';
          return;
        }
        if (page === 'components') {
          const items = await api('/api/v1/components');
          const rows = items.map(function (c) {
            return '<tr><td>' + c.internalNumber + '</td><td>' + c.name + '</td><td>' + c.status + '</td></tr>';
          }).join('') || '<tr><td colspan="3">Zatial ziadne komponenty</td></tr>';
          content.innerHTML = '<div class="stack"><h2>Komponenty</h2>' +
            makeTable(['Interne cislo', 'Nazov', 'Stav'], rows) + '</div>';
          return;
        }
        if (page === 'batteries') {
          const items = await api('/api/v1/batteries');
          const rows = items.map(function (b) {
            return '<tr><td>' + b.internalNumber + '</td><td>' + b.serialNumber + '</td><td>' +
              b.cycleCount + '</td><td>' + (b.healthPercent ?? '-') + '</td><td>' + b.status + '</td></tr>';
          }).join('') || '<tr><td colspan="5">Zatial ziadne baterie</td></tr>';
          content.innerHTML = '<div class="stack"><h2>Baterie</h2>' +
            makeTable(['Interne cislo', 'Vyrobne cislo', 'Cykly', 'Zdravie %', 'Stav'], rows) + '</div>';
        }
      } catch (err) {
        content.innerHTML = '<div class="error">' + err.message + '</div>';
      }
    }

    function openSearchHit(entityType, id, title) {
      state.searchHighlight = { entityType: entityType, id: id, title: title };
      var page = 'dashboard';
      if (entityType === 'Uas') page = 'uas';
      else if (entityType === 'Pilot') page = 'pilots';
      else if (entityType === 'Operation') page = 'operations';
      else if (entityType === 'Account') page = 'accounts';
      else if (entityType === 'SafetyEvent') page = 'incidents';
      else if (entityType === 'ControlAudit') {
        state.controlDetailId = id;
        page = 'controls';
      }
      document.querySelectorAll('.nav').forEach(function (b) {
        b.classList.toggle('active', b.dataset.page === page);
      });
      navigate(page);
    }

    function searchHighlightBanner() {
      if (!state.searchHighlight) return '';
      var h = state.searchHighlight;
      state.searchHighlight = null;
      return '<div class="msg">Z hladania: <b>' + (h.title || h.id) + '</b> (' + h.entityType + ')</div>';
    }

    function makeTable(headers, rowsHtml) {
      return '<table><thead><tr>' +
        headers.map(function (h) { return '<th>' + h + '</th>'; }).join('') +
        '</tr></thead><tbody>' + rowsHtml + '</tbody></table>';
    }

    function confirmAction(message) {
      return window.confirm(message || 'Pokracovat?');
    }

    function statusBadge(text) {
      var raw = (text == null ? '' : String(text));
      var key = raw.replace(/\s+/g, '').toLowerCase();
      var cls = 'badge';
      if (/inservice|active|approved|closed|resolved|sent|clear|ok|compliant|frozen|completed|verified/.test(key)) cls += ' badge-ok';
      else if (/draft|open|reported|pending|submitted|underrepair|high|warn|planned|inprogress|findingsreview|medium/.test(key)) cls += ' badge-warn';
      else if (/suspended|critical|rejected|cancelled|overdue|conflict|revoked|danger|noncompliant/.test(key)) cls += ' badge-danger';
      return '<span class="' + cls + '">' + raw + '</span>';
    }

    async function showHistory(entityType, entityId, containerEl) {
      if (!containerEl) return;
      containerEl.classList.remove('hidden');
      containerEl.innerHTML = '<h4>Historia</h4><p class="muted">Nacitavam...</p>';
      try {
        var q = '/api/v1/audit-events?entityType=' + encodeURIComponent(entityType) +
          '&entityId=' + encodeURIComponent(entityId);
        var events = await api(q);
        if (!events || !events.length) {
          containerEl.innerHTML = '<h4>Historia — ' + entityType + '</h4><p class="muted">Ziadne audit zaznamy.</p>';
          return;
        }
        var rows = events.slice(0, 40).map(function (e) {
          return '<tr><td>' + new Date(e.occurredAt).toLocaleString('sk-SK') +
            '</td><td>' + (e.actorUserName || '—') +
            '</td><td>' + e.action +
            '</td><td>' + statusBadge(e.result) + '</td></tr>';
        }).join('');
        containerEl.innerHTML = '<h4>Historia — ' + entityType + '</h4>' +
          makeTable(['Cas', 'Aktor', 'Akcia', 'Vysledok'], rows);
      } catch (err) {
        containerEl.innerHTML = '<h4>Historia</h4><div class="error">' + err.message + '</div>';
      }
    }

    /** Formuláre sú skryté; tlačidlá data-reveal / data-hide ich otvárajú a zatvárajú. */
    function bindFormReveals() {
      content.querySelectorAll('[data-reveal]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.getAttribute('data-reveal');
          var panel = document.getElementById(id);
          if (!panel) return;
          var willOpen = panel.classList.contains('hidden');
          content.querySelectorAll('.form-panel').forEach(function (p) { p.classList.add('hidden'); });
          if (willOpen) panel.classList.remove('hidden');
        });
      });
      content.querySelectorAll('[data-hide]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var panel = document.getElementById(btn.getAttribute('data-hide'));
          if (panel) panel.classList.add('hidden');
        });
      });
    }

    async function loadUasOptions() {
      try {
        const uasData = await api('/api/v1/uas?page=1&pageSize=50');
        return uasData.items || uasData.Items || [];
      } catch (err) {
        console.warn('UAS list', err);
        return [];
      }
    }

    function uasSelectHtml(uasList, emptyLabel) {
      if (!uasList.length) {
        return '<option value="">' + (emptyLabel || '(ziadne UAS v databaze)') + '</option>';
      }
      return uasList.map(function (u) {
        return '<option value="' + u.id + '">' + (u.registrationNumber || u.serialNumber) +
          ' — ' + u.manufacturer + ' ' + u.model + ' (' + u.status + ')</option>';
      }).join('');
    }

    async function createDemoUas() {
      const orgs = await api('/api/v1/org-units');
      const unit = orgs.find(function (o) { return o.code === 'UTVAR-A'; }) || orgs[0];
      const sn = 'UI-' + Date.now().toString().slice(-8);
      return api('/api/v1/uas', {
        method: 'POST',
        body: JSON.stringify({
          serialNumber: sn,
          manufacturer: 'DJI',
          model: 'M300',
          uasTypeCode: 'MULTI_ROTOR',
          owningOrgUnitId: unit.id,
          notes: 'Vytvorene z UI'
        })
      });
    }

    // Stary token po reštarte API nefunguje — vzdy ukaz login (okrem SSO callback)
    localStorage.removeItem('issuas.token');
    localStorage.removeItem('issuas.name');
    state.token = null;
    completeSsoCallbackFromUrl().then(function (handled) {
      if (!handled) showLogin();
    });
  </script>
</body>
</html>
